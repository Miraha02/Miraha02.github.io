# @file    deploy.yml
# @brief   Construit le site Astro et le publie sur GitHub Pages à chaque push sur main.
# @details Action officielle withastro/action puis actions/deploy-pages
#          (https://docs.astro.build/en/guides/deploy/github/).
#          Prérequis : Settings > Pages > Source = « GitHub Actions ».
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build with Astro
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5