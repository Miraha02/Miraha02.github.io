# @file    check.yml
# @brief   Builds and tests the site on every branch except main, without publishing.
# @details Runs the same `npm run build` as the deployment (types, unit tests, build,
#          dist/ checks, project states), so warnings are visible before merging into main.
#          Deployment itself stays in deploy.yml (main only).
name: Check (no deploy)

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and check
        run: npm run build